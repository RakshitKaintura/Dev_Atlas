spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.ai.google.genai.api-key=${GOOGLE_AI_API_KEY}
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT_ID}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.embedding.api-key=${GOOGLE_AI_API_KEY}
spring.ai.google.genai.embedding.project-id=${GOOGLE_CLOUD_PROJECT_ID}

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

# Session cookie for cross-origin frontend (localhost:3000)
server.servlet.session.cookie.name=DEVATLAS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50